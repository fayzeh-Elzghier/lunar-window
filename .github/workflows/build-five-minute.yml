name: Build NASA 5-minute demo evidence bundle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_5minute_evidence.py"
      - ".github/workflows/build-five-minute.yml"
permissions:
  contents: write
concurrency:
  group: lunar-window-source-verified-five-minute-bundle
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild actual NASA 5-minute browser bundle from source and hourly cross-check
        run: python scripts/build_5minute_evidence.py
      - name: Run all existing source guards
        run: |
          python -m compileall -q scripts src tests
          python -m unittest discover -s tests -v
      - name: Preserve source-derived browser dataset
        uses: actions/upload-artifact@v4
        with:
          name: nasa-real-five-minute-browser-data
          path: |
            docs/data/mission_dataset_fine.js
            docs/data/mission_dataset_fine.json
          retention-days: 30
      - name: Commit verified NASA-derived site-time observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/mission_dataset_fine.js docs/data/mission_dataset_fine.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'data: genuine JPL five-minute astronomy joined to NASA LOLA site screening'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
