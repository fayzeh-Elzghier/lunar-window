name: NASA source acquisition and scientific safety checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/nasa-science.yml'
      - 'scripts/acquire_site01.py'
      - 'scripts/embed_site01_data.py'
      - 'scripts/compute_local_horizon.py'
      - 'src/solar_geometry.py'
      - 'scripts/compare_local_skyline.py'

permissions:
  contents: write

concurrency:
  group: nasa-source-acquisition-main
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0  # Needed to rebase generated data safely onto the latest main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal science libraries
        run: python -m pip install --disable-pip-version-check numpy rasterio
      - name: Fetch official NASA Site01 LOLA and Horizons data (no synthetic)
        run: python scripts/acquire_site01.py
      - name: Calculate provisional local terrain skyline for Site01
        run: python scripts/compute_local_horizon.py --site Site01
      - name: Calculate provisional local terrain skyline for Site04
        run: python scripts/compute_local_horizon.py --site Site04
      - name: Compute NASA-derived provisional Sun/Earth local terrain screening
        run: python scripts/compare_local_skyline.py
      - name: Embed verified-source Site01 angles (NOT terrain visibility)
        run: python scripts/embed_site01_data.py
      - name: Run source-integrity checks (not mission-feasibility certification)
        run: |
          python -m unittest discover -s tests -v
          python -m compileall -q scripts src tests
          # Verify authored/generated UI whitespace only. Raw NASA Horizons text
          # deliberately preserves source bytes (including trailing spaces) for SHA256
          # reproducibility; CSVs use CRLF and are source data, not code style.
          git diff --check -- docs/index.html src scripts tests .github/workflows
      - name: Publish NASA provenance artifact for reproducibility
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lunar-window-nasa-site01-and-local-horizon
          path: |
            data/site01_audit/sample.csv
            data/site01_audit/sun.txt
            data/site01_audit/earth.txt
            data/site01_audit/queries.json
            data/site01_audit/metadata.json
            data/site01_audit/local_horizon.csv
            data/site01_audit/local_horizon_meta.json
            data/site01_audit/terrain_screen_hourly.csv
            data/site04_audit/terrain_screen_hourly.csv
            data/site04_audit/local_horizon.csv
            data/site04_audit/local_horizon_meta.json
          retention-days: 30
      - name: Commit source records and provisional outputs without overwriting concurrent edits
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html data/site01_audit/sample.csv data/site01_audit/sun.txt \
            data/site01_audit/earth.txt data/site01_audit/metadata.json \
            data/site01_audit/queries.json data/site01_audit/local_horizon.csv \
            data/site01_audit/local_horizon_meta.json \
            data/site01_audit/terrain_screen_hourly.csv \
            data/site04_audit/terrain_screen_hourly.csv \
            data/site04_audit/local_horizon.csv data/site04_audit/local_horizon_meta.json
          if git diff --cached --quiet; then
            echo "No generated source records changed; nothing to commit."
            exit 0
          fi

          git commit -m "data: ingest actual NASA Site01 ephemeris and provisional LOLA local skylines"
          # The main branch can advance while NASA source acquisition runs.
          # Rebase ONLY our generated-data commit onto the latest main and retry
          # non-force pushes. Abort on a real conflict; never discard team edits.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::Generated outputs conflict with newer work on main. Review the uploaded provenance artifact; no force push was attempted."
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Generated NASA source records safely published on main."
              exit 0
            fi
            echo "::warning::main advanced during push (attempt ${attempt}/5); fetching and retrying without force."
            sleep $((attempt * 2))
          done
          echo "::error::main kept advancing; provenance artifact remains available. Retry this workflow when commits settle."
          exit 1
