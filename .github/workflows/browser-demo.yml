name: Browser E2E + authentic 30-second NASA source demo
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/browser_acceptance.cjs'
      - 'docs/mission-console.html'
      - 'docs/mission-console.js'
      - 'docs/mission-console.css'
      - 'docs/judges-slides.html'
      - '.github/workflows/browser-demo.yml'
permissions:
  contents: write
concurrency:
  group: lunar-window-public-browser-demo
  cancel-in-progress: false
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright and headless Chromium
        run: |
          npm install --no-save playwright@1.61.0
          npx playwright install --with-deps chromium
      - name: Serve actual source-built GitHub Pages files
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs >/tmp/lunar-window-http.log 2>&1 &
          sleep 2
      - name: Desktop, mobile, NASA and seven-slide browser acceptance
        run: node scripts/browser_acceptance.cjs
      - name: Install video encoder on Ubuntu 26.04
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Encode real browser screencast under 30 seconds
        run: |
          mkdir -p docs/demo
          ffmpeg -y -hide_banner -loglevel error -i artifacts/browser/mission-rescue-real-browser.webm \
            -t 29 -vf "drawbox=x=0:y=h-38:w=iw:h=38:color=black@0.80:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf:text='Research prototype - AI-assisted code - NASA source data - NOT a certified mission pass':x=16:y=h-28:fontsize=17:fontcolor=white" \
            -c:v libx264 -crf 30 -preset veryfast -pix_fmt yuv420p -movflags +faststart -an docs/demo/mission-rescue-demo.mp4
          ffprobe -v error -show_entries format=duration,size -of json docs/demo/mission-rescue-demo.mp4
      - name: Archive actual screenshots and video
        uses: actions/upload-artifact@v4
        with:
          name: lunar-window-real-browser-demo-and-acceptance
          path: |
            artifacts/browser/*.png
            artifacts/browser/*.webm
            docs/demo/*.mp4
          retention-days: 30
      - name: Publish real-source screen recording on public GitHub Pages
        run: |
          test -s docs/demo/mission-rescue-demo.mp4
          # The public demo binary may already exist from an earlier validated run.
          # Do not overwrite it and create a needless binary rebase conflict.
          git fetch origin main
          if git cat-file -e origin/main:docs/demo/mission-rescue-demo.mp4 2>/dev/null; then
            echo "Public demo exists. New verified recording is in the Actions artifact; no binary rewrite."
            exit 0
          fi
          bytes=$(stat -c '%s' docs/demo/mission-rescue-demo.mp4)
          if [ "$bytes" -gt 15000000 ]; then echo 'Video too large'; exit 1; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/demo/mission-rescue-demo.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'demo: real Chromium app walkthrough under 30 seconds with AI disclosure'
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i*2))
          done
          exit 1
