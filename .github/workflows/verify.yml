name: Verify NASA provenance and science safeguards
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate Python syntax
        run: python -m compileall -q src scripts tests
      - name: Check offline website JS and NASA/LOLA time alignment
        run: python scripts/check_dashboard_js.py
      - name: NASA provenance and science-release safeguards
        run: python -m unittest discover -s tests -v
