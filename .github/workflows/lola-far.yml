name: Audit NASA extended-distance lunar terrain (optional research)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/audit_far_lola.py"
      - ".github/workflows/lola-far.yml"
permissions:
  contents: write
concurrency:
  group: nasa-far-field-research
  cancel-in-progress: false
jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install geospatial reader
        run: python -m pip install rasterio numpy
      - name: Discover NASA official 80m South Pole DEM and screen 300 km of distant terrain
        run: python scripts/audit_far_lola.py
      - name: Save provenance and explicitly provisional far-field horizon
        uses: actions/upload-artifact@v4
        with:
          name: nasa-lola-distant-terrain-screen
          path: |
            data/site01_audit/far_lola_horizon.csv
            data/site01_audit/far_lola_meta.json
            data/site04_audit/far_lola_horizon.csv
            data/site04_audit/far_lola_meta.json
          retention-days: 30
      - name: Publish only compact evidence files (never raw large imagery)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/site01_audit/far_lola_horizon.csv data/site01_audit/far_lola_meta.json \
            data/site04_audit/far_lola_horizon.csv data/site04_audit/far_lola_meta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: source-traceable provisional NASA South Pole distant terrain audit"
          for i in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((2*i))
          done
          exit 1
